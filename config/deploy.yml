# Rails Runner on the BookSparkle VM, served at games.booksparkle.kids.
# Own Postgres + Redis accessories so this does not collide with booksparkle-db
# (which already binds 127.0.0.1:5432).
service: rails-runner

image: vishalzambre/rails-runner

servers:
  web:
    - games.booksparkle.kids

# kamal-proxy already terminates SSL for booksparkle.kids on this host.
# A second host on the same proxy is how both apps share ports 80/443.
proxy:
  ssl: true
  host: games.booksparkle.kids
  app_port: 80

registry:
  server: docker.io
  username: vishalzambre
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - RAILS_RUNNER_DATABASE_PASSWORD
    - ADMIN_PASSWORD
  clear:
    DB_HOST: rails-runner-db
    DB_PORT: "5432"
    POSTGRES_DB: rails_runner_production
    POSTGRES_USER: rails_runner
    REDIS_URL: redis://rails-runner-redis:6379/0
    APP_HOST: https://games.booksparkle.kids
    CONFERENCE_SLUG: deccan-rails-conf
    ADMIN_USERNAME: admin
    SEED_ON_BOOT: "true"
    RAILS_LOG_TO_STDOUT: "true"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Bridge digested Vite + Propshaft files across deploys so in-flight requests
# do not 404 while kamal-proxy drains the previous container.
asset_path: /app/public

builder:
  arch: amd64
  dockerfile: Dockerfile
  args:
    RUBY_VERSION: 4.0.1

ssh:
  user: ubuntu

# Do not publish accessory ports on the host — BookSparkle already owns 5432.
accessories:
  db:
    image: postgres:16
    host: games.booksparkle.kids
    env:
      clear:
        POSTGRES_DB: rails_runner_production
        POSTGRES_USER: rails_runner
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: games.booksparkle.kids
    cmd: redis-server --appendonly yes
    directories:
      - data:/data
