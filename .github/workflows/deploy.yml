name: Deploy (Kamal)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup SSH agent (passphrase key)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/usr/bin/env bash
          echo "$SSH_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export DISPLAY=:0
          setsid ssh-add ~/.ssh/deploy_key < /dev/null

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_RUNNER_DATABASE_PASSWORD: ${{ secrets.RAILS_RUNNER_DATABASE_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
        run: |
          # Accessories are not created by `kamal deploy`. Boot them on first
          # run; if they already exist, start them instead.
          bundle exec kamal accessory boot db || bundle exec kamal accessory start db
          bundle exec kamal accessory boot redis || bundle exec kamal accessory start redis
          bundle exec kamal deploy --version "${GITHUB_SHA::12}"
